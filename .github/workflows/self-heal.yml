name: Self-heal (auto-fix & PR)

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["ci"]
    types:
      - completed

permissions:
  contents: write
  pull-requests: write
  actions: read

jobs:
  self-heal:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install deps (best-effort frozen)
        id: install_try_frozen
        run: |
          set -euxo pipefail
          pnpm install --frozen-lockfile || echo "FROZEN_FAILED=1" >> $GITHUB_OUTPUT

      - name: Install deps (fallback non-frozen)
        if: steps.install_try_frozen.outputs.FROZEN_FAILED == '1'
        run: |
          set -euxo pipefail
          pnpm install

      - name: Run healthcheck (pre-repair)
        continue-on-error: true
        run: node scripts/healthcheck.mjs | tee /tmp/selfheal-pre.txt

      - name: Attempt self-heal repairs
        run: node scripts/self-heal.mjs | tee /tmp/selfheal-repair.txt

      - name: Run healthcheck (post-repair)
        id: post
        continue-on-error: true
        run: node scripts/healthcheck.mjs | tee /tmp/selfheal-post.txt

      - name: Collect logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selfheal-logs
          path: |
            /tmp/selfheal-pre.txt
            /tmp/selfheal-repair.txt
            /tmp/selfheal-post.txt

      - name: Create PR with fixes
        if: steps.post.outcome == 'success'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git add .
          if ! git diff --staged --quiet; then
            BRANCH_NAME="self-heal-$(date +%s)"
            git checkout -b "$BRANCH_NAME"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: auto-fix lint and format issues"
            git push origin "$BRANCH_NAME"
            gh pr create \
              --title "Automated Self-Heal Fixes" \
              --body "This PR contains automated fixes generated by the self-heal workflow. Logs are attached to the workflow run." \
              --label "self-heal" \
              --head "$BRANCH_NAME" \
              --base main
          else
            echo "No changes to commit."
          fi
